# Workflow lint only until T2 lands the Gradle wrapper (PLAN.md, section 6).
# Kotlin/Native and platform jobs are added in T2 / T29.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Workflow lint: jactionlint with .github/jactionlint.yaml and its baseline, the check the
  # pre-push hook (hk.pkl) runs. install_args installs only jactionlint; its version matches
  # mise.toml. shellcheck comes from the runner image.
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: github:jdx/jactionlint@2.0.2
      - run: jactionlint --color
